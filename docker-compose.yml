

services:
  web:
    image: nginx:latest
    container_name: nginx_homelab
    ports:
      - "8880:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
